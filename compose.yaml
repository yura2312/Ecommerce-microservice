services:
  # Redis Service (for cart microservice)
  redis:
    image: redis:alpine
    container_name: redis-dev
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  # Keycloak Service (for authentication/gateway)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak-dev
    command:
      - "start-dev"
      - "--import-realm"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "9000:8080"
      - "9001:9090"
    volumes:
      - "./realm-export.json:/opt/keycloak/data/import/realm-export.json"

  # Mongo Service (for product microservice)
  mongo:
    image: mongo
    container_name: mongo-dev
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      # Optional: Persist the data so it isn't lost when containers are removed
      - mongo-data:/data/db
  # Postgres Service (for order microservice)
  postgres:
    image: postgres:18.1-alpine3.23
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      # 1. Identity and Roles
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # 2. Listener Definitions
      # INTERNAL: For communication inside the Docker network
      # EXTERNAL: For tools on your host machine (IntelliJ, etc.)
      # CONTROLLER: For the KRaft quorum communication
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      # 3. Advertised Listeners (The "Address Book" sent to clients)
      # We tell IntelliJ to find us at localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:9092

      # 4. Security Protocol Mapping
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # 5. Controller and Inter-Broker Settings
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # 6. Basic Cluster Tweaks for Local Dev
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
volumes:
  mongo-data:
    driver: local
  postgres-data:
    driver: local
